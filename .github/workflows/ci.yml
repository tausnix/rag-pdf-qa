name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        working-directory: rag-pdf-qa
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Unit tests
        working-directory: rag-pdf-qa
        run: python -m pytest tests -q

      - name: Build corpus, index and benchmark
        working-directory: rag-pdf-qa
        run: python run_pipeline.py

      - name: Health check
        working-directory: rag-pdf-qa
        run: python scripts/smoke_test.py

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: |
            rag-pdf-qa/reports/benchmark.json
            rag-pdf-qa/reports/benchmark.md
